name: Prepare or deploy DEKS NEXA to LWS

# Manual only: no push, schedule or other automatic trigger.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "check (read-only) | backup (download the server files) | cleanup (delete the paths listed in .github/lws-cleanup.txt) | probe (upload one unique test file) | deploy (upload the site files)"
        required: true
        type: choice
        options:
          - check
          - backup
          - cleanup
          - probe
          - deploy
        default: check
      confirm_production_overwrite:
        description: "Required for deploy: authorize overwriting matching files in the live site directory"
        required: true
        type: boolean
        default: false
      confirm_remote_delete:
        description: "Required for cleanup: authorize deleting exactly the paths listed in .github/lws-cleanup.txt"
        required: true
        type: boolean
        default: false
      only:
        description: "Optional for deploy: comma-separated site files to upload (default: every site file)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: lws-manual-deploy
  cancel-in-progress: false

jobs:
  transfer:
    name: LWS FTPS ${{ inputs.operation }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LWS_HOST: ${{ secrets.LWS_HOST }}
      LWS_USERNAME: ${{ secrets.LWS_USERNAME }}
      LWS_PASSWORD: ${{ secrets.LWS_PASSWORD }}
      LWS_REMOTE_PATH: ${{ secrets.LWS_REMOTE_PATH }}
      # Optional repository variable: the host name the TLS certificate must be valid for,
      # when LWS presents a certificate for its own server name instead of LWS_HOST.
      LWS_TLS_SERVERNAME: ${{ vars.LWS_TLS_SERVERNAME }}
      LWS_OPERATION: ${{ inputs.operation }}
      LWS_ONLY: ${{ inputs.only }}
      CONFIRM_PRODUCTION_OVERWRITE: ${{ inputs.confirm_production_overwrite }}
      CONFIRM_REMOTE_DELETE: ${{ inputs.confirm_remote_delete }}
    steps:
      - name: Check out the selected main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required connection settings
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in LWS_HOST LWS_USERNAME LWS_PASSWORD LWS_REMOTE_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub secret is missing: ${name}"
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi
          if [[ "$LWS_REMOTE_PATH" != /* || "$LWS_REMOTE_PATH" == *".."* ]]; then
            echo "::error::LWS_REMOTE_PATH must be an absolute path such as / or /htdocs, without '..'."
            exit 1
          fi
          tls_name="${LWS_TLS_SERVERNAME:-$LWS_HOST}"
          if [[ ! "$tls_name" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::The TLS host name (LWS_TLS_SERVERNAME or LWS_HOST) is not a valid host name."
            exit 1
          fi
          if [[ "$LWS_OPERATION" == "deploy" && "$CONFIRM_PRODUCTION_OVERWRITE" != "true" ]]; then
            echo "::error::Deployment stopped: set confirm_production_overwrite to true for this manual run."
            exit 1
          fi
          if [[ "$LWS_OPERATION" == "deploy" && ! -f index.html ]]; then
            echo "::error::Deployment stopped: index.html is missing from the repository root."
            exit 1
          fi
          if [[ "$LWS_OPERATION" == "cleanup" && "$CONFIRM_REMOTE_DELETE" != "true" ]]; then
            echo "::error::Cleanup stopped: set confirm_remote_delete to true for this manual run."
            exit 1
          fi
          if [[ "$LWS_OPERATION" == "cleanup" && ! -s .github/lws-cleanup.txt ]]; then
            echo "::error::Cleanup stopped: .github/lws-cleanup.txt is missing or empty."
            exit 1
          fi
          echo "All required settings are present (values are never printed)."

      - name: Confirm IPv4 FTPS port reachability
        shell: bash
        run: |
          python3 - <<'PY'
          import os, socket

          host = os.environ["LWS_HOST"]
          try:
              addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, 21, socket.AF_INET, socket.SOCK_STREAM)})
          except OSError:
              print("::error::The LWS host did not resolve to an IPv4 address.")
              raise SystemExit(1)
          for address in addresses:
              try:
                  with socket.create_connection((address, 21), timeout=8):
                      print("IPv4 FTPS control port 21 is reachable from this runner.")
                      break
              except OSError:
                  continue
          else:
              print("::error::Port 21 of the LWS host is not reachable from this runner (network filtering on the LWS side?).")
              raise SystemExit(1)
          PY

      - name: Verify the LWS TLS certificate (no login)
        shell: bash
        run: |
          set -euo pipefail
          tls_name="${LWS_TLS_SERVERNAME:-$LWS_HOST}"
          details="$RUNNER_TEMP/lws_tls_details"
          result="$RUNNER_TEMP/lws_tls_result"
          # Display only: what the server presents (subject, alternative names, issuer, expiry).
          openssl s_client -connect "${LWS_HOST}:21" -starttls ftp -servername "$tls_name" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName >"$details" 2>/dev/null || true
          echo "Certificate presented by the FTP server:"
          cat "$details" || true
          # Strict verification: trusted chain AND host name. TLS verification is never disabled.
          if ! openssl s_client -connect "${LWS_HOST}:21" -starttls ftp -servername "$tls_name" \
                 -verify_hostname "$tls_name" -verify_return_error -brief </dev/null >"$result" 2>&1; then
            grep -iE "verif|error" "$result" | head -n 10 || true
            echo "::error::TLS certificate verification failed for the expected host name. If the certificate is issued for an LWS server name (for example *.lwspanel.com), ask LWS which FTP server name is covered by it and save that name in the repository variable LWS_TLS_SERVERNAME."
            exit 1
          fi
          grep -iE "^(Protocol version|Verification)" "$result" || true
          echo "TLS certificate chain and host name verified."

      - name: Prepare the FTPS helper
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/lws_ftps.py" <<'PY'
          """Explicit FTPS (AUTH TLS, port 21) helper for the LWS workflow.

          - TLS is mandatory and the certificate (chain and host name) is always verified.
          - Credentials come from the environment and are never printed.
          - Only `cleanup` deletes anything, and only the paths listed in .github/lws-cleanup.txt.
          - `deploy` never deletes and never uploads the excluded files below.
          """
          import fnmatch
          import ftplib
          import os
          import posixpath
          import ssl
          import sys
          import urllib.parse
          from pathlib import Path

          HOST = os.environ["LWS_HOST"]
          TLS_NAME = os.environ.get("LWS_TLS_SERVERNAME") or HOST
          REMOTE = "/" + os.environ["LWS_REMOTE_PATH"].strip("/")
          TMP = Path(os.environ["RUNNER_TEMP"])
          ROOT = Path.cwd()

          # Never uploaded to the server (permanent exclusion list).
          EXCLUDED = [
              ".git", ".git/*", ".github", ".github/*", ".vercel", ".vercel/*",
              ".env*", "*/.env*", ".gitignore", ".gitattributes",
              "scss", "scss/*", "*.scss", "*.map", "*.md", "PROMPT_*",
              "_backup_serveur_*", "_backup_serveur_*/*", "_src", "_src/*", "favicon-nouveau", "favicon-nouveau/*",
              "node_modules", "node_modules/*", "Thumbs.db", "*/Thumbs.db", ".DS_Store", "*/.DS_Store",
          ]
          # Never copied into the backup artifact (the repository is public).
          BACKUP_SKIPPED = [".git", ".git/*", ".env*", "*/.env*"]
          # Never deletable as a whole.
          PROTECTED = {"", ".", "index.html", ".htaccess", "404.html", "css", "js", "image", "img"}


          def matches(rel, patterns):
              return any(fnmatch.fnmatch(rel, pattern) for pattern in patterns)


          class LwsFTP(ftplib.FTP_TLS):
              def ntransfercmd(self, cmd, rest=None):
                  conn, size = ftplib.FTP.ntransfercmd(self, cmd, rest)
                  if self._prot_p:
                      conn = self.context.wrap_socket(conn, server_hostname=TLS_NAME, session=self.sock.session)
                      unwrap = conn.unwrap

                      def safe_unwrap():
                          try:
                              return unwrap()
                          except (ssl.SSLError, OSError):
                              return None

                      conn.unwrap = safe_unwrap
                  return conn, size


          def connect():
              context = ssl.create_default_context()
              context.minimum_version = ssl.TLSVersion.TLSv1_2
              context.maximum_version = ssl.TLSVersion.TLSv1_2
              ftp = LwsFTP(context=context, timeout=60)
              ftp.connect(HOST, 21)
              ftp.host = TLS_NAME  # the certificate must be valid for this name
              ftp.auth()
              ftp.login(os.environ["LWS_USERNAME"], os.environ["LWS_PASSWORD"])
              ftp.prot_p()
              ftp.cwd(REMOTE)
              ftp.voidcmd("TYPE I")
              return ftp


          def entries(ftp, path):
              """(name, is_dir, size) of a remote directory, relative to REMOTE."""
              result = []
              try:
                  for name, facts in ftp.mlsd(path, facts=["type", "size"]):
                      kind = facts.get("type", "").lower()
                      if name in (".", "..") or kind in ("cdir", "pdir"):
                          continue
                      result.append((name, kind == "dir", int(facts.get("size", 0) or 0)))
                  return result
              except ftplib.error_perm:
                  pass
              for full in ftp.nlst(path):
                  name = posixpath.basename(full.rstrip("/"))
                  if name in (".", ".."):
                      continue
                  child = posixpath.join(path, name) if path not in ("", ".") else name
                  try:
                      ftp.cwd(child)
                      ftp.cwd(REMOTE)
                      result.append((name, True, 0))
                  except ftplib.error_perm:
                      result.append((name, False, 0))
              return result


          def walk(ftp, rel="", prune=()):
              for name, is_dir, size in entries(ftp, rel or "."):
                  child = f"{rel}/{name}" if rel else name
                  if matches(child, prune):
                      yield child, is_dir, size, True
                      continue
                  yield child, is_dir, size, False
                  if is_dir:
                      yield from walk(ftp, child, prune)


          def is_remote_dir(ftp, rel):
              try:
                  ftp.cwd(rel)
                  return True
              except ftplib.error_perm:
                  return False
              finally:
                  ftp.cwd(REMOTE)


          def check():
              ftp = connect()
              names = sorted(name for name, _, _ in entries(ftp, "."))
              print(f"FTPS login succeeded; the remote site directory has {len(names)} entries:")
              print("  " + ", ".join(names))
              if "index.html" not in names:
                  print("::error::The remote directory does not contain index.html: check LWS_REMOTE_PATH.")
                  raise SystemExit(1)
              print(f"index.html size: {ftp.size('index.html')} bytes")
              ftp.quit()
              print("Read-only check finished: no file was transferred, created, modified or deleted.")


          def backup():
              ftp = connect()
              dest = TMP / "lws-backup"
              dest.mkdir(parents=True, exist_ok=True)
              manifest, files, total = [], 0, 0
              for rel, is_dir, size, pruned in walk(ftp, prune=BACKUP_SKIPPED):
                  if pruned:
                      manifest.append(f"{'dir ' if is_dir else 'file'}\t-\t{rel}\t(present on the server, not copied: sensitive)")
                      continue
                  if is_dir:
                      (dest / rel).mkdir(parents=True, exist_ok=True)
                      manifest.append(f"dir \t-\t{rel}")
                      continue
                  target = dest / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with open(target, "wb") as handle:
                      ftp.retrbinary(f"RETR {rel}", handle.write)
                  files += 1
                  total += target.stat().st_size
                  manifest.append(f"file\t{target.stat().st_size}\t{rel}")
              ftp.quit()
              (dest / "_manifest_serveur.tsv").write_text("\n".join(manifest) + "\n", encoding="utf-8")
              print(f"Backup finished: {files} files ({total} bytes) downloaded. Nothing was modified on the server.")
              for line in manifest:
                  if "not copied" in line:
                      print("  " + line.replace("\t", " "))


          def cleanup():
              wanted = []
              for line in (ROOT / ".github/lws-cleanup.txt").read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      wanted.append(line.strip("/"))
              for rel in wanted:
                  if rel in PROTECTED or ".." in rel.split("/") or rel.startswith("/"):
                      print(f"::error::Refusing to delete protected or unsafe path: {rel}")
                      raise SystemExit(1)
              ftp = connect()
              deleted = absent = 0
              for rel in wanted:
                  if is_remote_dir(ftp, rel):
                      children = list(walk(ftp, rel))
                      for child, is_dir, _, _ in children:
                          if not is_dir:
                              ftp.delete(child)
                              deleted += 1
                      for child in sorted((c for c, is_dir, _, _ in children if is_dir), key=lambda p: p.count("/"), reverse=True):
                          ftp.rmd(child)
                      ftp.rmd(rel)
                      print(f"deleted folder {rel} ({sum(1 for c in children if not c[1])} files)")
                      continue
                  try:
                      ftp.delete(rel)
                      deleted += 1
                      print(f"deleted {rel}")
                  except ftplib.error_perm as error:
                      if str(error).startswith("550"):
                          absent += 1
                          print(f"absent, skipped: {rel}")
                      else:
                          raise
              ftp.quit()
              print(f"Cleanup finished: {deleted} files deleted, {absent} already absent. Only listed paths were touched.")


          def site_files():
              candidates = []
              for path in sorted(ROOT.rglob("*")):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(ROOT).as_posix()
                  if matches(rel, EXCLUDED):
                      continue
                  candidates.append(rel)
              text = "\n".join(
                  urllib.parse.unquote((ROOT / rel).read_text(encoding="utf-8", errors="ignore"))
                  for rel in candidates
                  if rel.endswith((".html", ".css", ".js", ".xml", ".txt", ".json", ".webmanifest", ".htaccess"))
              )
              files = [rel for rel in candidates if not rel.startswith(("image/", "img/")) or rel in text]
              # Assets first, then pages, .htaccess last (it may reference 404.html).
              return sorted(files, key=lambda rel: (rel == ".htaccess", rel.endswith(".html"), rel))


          def deploy():
              files = site_files()
              only = [item.strip().strip("/") for item in os.environ.get("LWS_ONLY", "").split(",") if item.strip()]
              if only:
                  unknown = [item for item in only if item not in files]
                  if unknown:
                      print("::error::Not deployable (excluded, unused or missing): " + ", ".join(unknown))
                      raise SystemExit(1)
                  files = [rel for rel in files if rel in only]
              ftp = connect()
              made = set()
              for rel in files:
                  folder = posixpath.dirname(rel)
                  current = ""
                  for part in folder.split("/") if folder else []:
                      current = f"{current}/{part}" if current else part
                      if current not in made:
                          try:
                              ftp.mkd(current)
                          except ftplib.error_perm:
                              pass
                          made.add(current)
                  with open(ROOT / rel, "rb") as handle:
                      ftp.storbinary(f"STOR {rel}", handle)
                  print(f"uploaded {rel}")
              names = {name for name, _, _ in entries(ftp, ".")}
              ftp.quit()
              if "index.html" not in names:
                  print("::error::index.html was not found after the upload.")
                  raise SystemExit(1)
              print(f"{len(files)} site files uploaded over FTPS. No remote file was deleted.")


          def probe():
              run_id = os.environ["GITHUB_RUN_ID"]
              attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              name = f"deks-nexa-ftps-probe-{run_id}-{attempt}.txt"
              content = f"DEKS NEXA LWS FTPS probe; run {run_id} attempt {attempt}\n".encode()
              ftp = connect()
              if name in {n for n, _, _ in entries(ftp, ".")}:
                  print(f"::error::{name} already exists on the server; nothing was uploaded.")
                  raise SystemExit(1)
              local = TMP / name
              local.write_bytes(content)
              with open(local, "rb") as handle:
                  ftp.storbinary(f"STOR {name}", handle)
              chunks = []
              ftp.retrbinary(f"RETR {name}", chunks.append)
              ftp.quit()
              if b"".join(chunks) != content:
                  print("::error::The probe file read back from the server does not match what was uploaded.")
                  raise SystemExit(1)
              print(f"Probe uploaded and verified: {name} (intentionally LEFT on the server; nothing deleted or overwritten).")


          if __name__ == "__main__":
              operations = {"check": check, "backup": backup, "cleanup": cleanup, "probe": probe, "deploy": deploy}
              try:
                  operations[sys.argv[1]]()
              except ssl.SSLCertVerificationError as error:
                  print(f"::error::TLS certificate verification failed: {error.verify_message}")
                  raise SystemExit(1)
              except ftplib.all_errors as error:
                  print(f"::error::FTPS {sys.argv[1]} failed: {error}")
                  raise SystemExit(1)
          PY
          chmod 600 "$RUNNER_TEMP/lws_ftps.py"

      - name: Run the requested operation
        if: inputs.operation != 'deploy' || inputs.confirm_production_overwrite
        shell: bash
        run: python3 "$RUNNER_TEMP/lws_ftps.py" "$LWS_OPERATION"

      - name: Keep the server backup as a short-lived artifact
        if: inputs.operation == 'backup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lws-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/lws-backup
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
